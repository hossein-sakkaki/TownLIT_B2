{% extends "admin/base_site.html" %}
{% block content %}
<style>.tl-form{max-width:880px;margin:0 auto}.tl-box{border:1px solid var(--hairline-color);border-radius:14px;padding:24px;background:var(--body-bg)}.tl-help{padding:14px 16px;border-radius:10px;background:var(--darkened-bg);margin-bottom:20px}.tl-form p{margin:0 0 16px}.tl-form label{display:block;font-weight:700;margin-bottom:6px}.tl-form input,.tl-form select,.tl-form textarea{width:100%;max-width:100%;box-sizing:border-box}.tl-actions{display:flex;gap:10px;margin-top:22px}.tl-btn{padding:10px 16px;border-radius:7px;text-decoration:none!important;border:1px solid var(--hairline-color)}.tl-primary{background:var(--button-bg);color:#fff!important;border-color:var(--button-bg)}</style>
<div class="tl-form"><p><a href="{% url 'accounting_admin:accounting-money-workspace' %}">← Money In & Out</a></p><div class="tl-box"><h1>{{ title }}</h1><div class="tl-help">{{ help_copy }}</div><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<div class="tl-actions"><button class="tl-btn tl-primary" type="submit">{{ submit_label }}</button><a class="tl-btn" href="{% url 'accounting_admin:accounting-money-workspace' %}">Cancel</a></div></form></div></div>
{% endblock %}{% block sidebar %}{% endblock %}
