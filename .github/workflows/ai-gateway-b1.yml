name: AI Gateway B1 acceptance

on:
  pull_request:
    branches: [security/django-5.2-lts-20261022]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-gateway-b1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-mysql:
    name: B1 security and Backend regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the proposed merge without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the authorized baseline and whitespace
        env:
          B1_BASE_SHA: 524dbffbb68ed7e1b74b72d6e088618ff73ae779
        run: |
          test "$(git rev-parse origin/security/django-5.2-lts-20261022)" = "$B1_BASE_SHA"
          git merge-base --is-ancestor "$B1_BASE_SHA" HEAD
          git diff --check "$B1_BASE_SHA" HEAD

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the unchanged Backend manifest and scoped lint tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config default-libmysqlclient-dev
          python -m pip install -r requirements.txt ruff==0.14.4
          python -m pip check
          python --version

      - name: Check B1 headers, code quality and formatting
        run: |
          python scripts/check_ai_gateway_headers.py
          ruff check --select E4,E7,E9,F,I apps/ai_gateway scripts/check_ai_gateway_headers.py
          ruff format --check apps/ai_gateway scripts/check_ai_gateway_headers.py

      - name: Start disposable MySQL with no network or published ports
        run: |
          mkdir -p ../b1-mysql-socket
          docker run --detach --rm --name townlit-b1-mysql --network none \
            --mount "type=bind,src=$(realpath ../b1-mysql-socket),dst=/var/run/mysqld" \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=townlit_b1_disposable \
            mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902 \
            --skip-log-bin --innodb-flush-log-at-trx-commit=2
          for attempt in $(seq 1 60); do
            if docker exec townlit-b1-mysql mysqladmin ping --silent; then
              docker exec townlit-b1-mysql chmod 755 /var/run/mysqld
              docker exec townlit-b1-mysql mysql -uroot -Nse 'SELECT VERSION();'
              exit 0
            fi
            sleep 2
          done
          docker logs townlit-b1-mysql
          exit 1

      - name: Run Gateway security tests on MySQL and SQLite
        run: |
          python -m apps.ai_gateway.tests.run mysql test apps.ai_gateway.tests --noinput -v 2
          python -m apps.ai_gateway.tests.run core test apps.ai_gateway.tests --noinput -v 2

      - name: Check Gateway migration drift and reversibility
        run: |
          python -m apps.ai_gateway.tests.run mysql makemigrations ai_gateway --check --dry-run
          python -m apps.ai_gateway.tests.run backend makemigrations ai_gateway --check --dry-run
          python -m apps.ai_gateway.tests.run mysql migrate ai_gateway --noinput
          python -m apps.ai_gateway.tests.run mysql migrate ai_gateway zero --noinput
          python -m apps.ai_gateway.tests.run mysql migrate ai_gateway --noinput
          python -m apps.ai_gateway.tests.run backend check

      - name: Run selected Backend regressions with the full migration graph
        run: |
          python -m apps.ai_gateway.tests.run backend test \
            apps.ai_gateway.tests.backend_regression \
            apps.accounts.tests.test_session_jwt_issuance \
            apps.accounts.tests.test_session_generation_enforcement \
            apps.accounts.tests.test_session_security_foundation \
            apps.accounts.tests.test_legacy_token_obtain_policy \
            apps.accounts.tests.test_password_reset_token_v2 \
            apps.accounts.tests.test_password_session_revocation \
            apps.accounts.tests.test_two_factor_login_single_use \
            apps.accounts.tests.test_backend_exception_redaction \
            --noinput -v 2

      - name: Remove only this job's disposable database container
        if: always()
        run: docker rm --force townlit-b1-mysql || true
