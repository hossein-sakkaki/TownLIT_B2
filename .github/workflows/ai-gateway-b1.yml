# .github/workflows/ai-gateway-b1.yml
# TownLIT-Backend
#
# Created by Hossein Sakkaki on 2026-11-06.
# Last Update by Hossein Sakkaki on 2026-11-09.
#

name: AI Gateway B1 acceptance

on:
  pull_request:
    branches: [checkpoint/backend-before-codex-auth-20261109]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-gateway-b1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-b11a:
    name: B1.1A isolated ES256 profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install only the isolated synthetic verifier profile
        run: |
          python -m venv ../b11a-venv
          ../b11a-venv/bin/python -m pip install -r requirements.ai-gateway-b11a.txt
          ../b11a-venv/bin/python -m pip check
      - name: Verify signed synthetic tokens and public denial
        run: |
          ../b11a-venv/bin/python -m apps.ai_gateway.tests.run core test apps.ai_gateway.tests.service_tokens --noinput -v 2

  synthetic-mysql:
    name: B1 refresh compatibility / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, supported]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the proposed merge without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the authorized baseline and whitespace
        env:
          B1_BASE_SHA: c51ad810ecef6fd4d6ffff6bc660c44676cfe9f4
        run: |
          test "$(git rev-parse origin/checkpoint/backend-before-codex-auth-20261109)" = "$B1_BASE_SHA"
          git merge-base --is-ancestor "$B1_BASE_SHA" HEAD
          git diff --check "$B1_BASE_SHA" HEAD

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install an independent disposable full Backend profile
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config default-libmysqlclient-dev
          python scripts/ai_gateway_dependency_profile.py "${{ matrix.profile }}" > ../b11b-profile.txt
          python -m pip install -r ../b11b-profile.txt ruff==0.14.4
          python -m pip freeze > ../b11b-resolved.txt
          python -m pip check
          python --version

      - name: Check B1 headers, code quality and formatting
        run: |
          python scripts/check_ai_gateway_headers.py
          ruff check --select E4,E7,E9,F,I apps/ai_gateway scripts/check_ai_gateway_headers.py scripts/ai_gateway_dependency_profile.py scripts/check_jwt_user_transitions.py apps/accounts/serializers/session_refresh.py apps/accounts/views/token_obtain_views.py apps/accounts/tests/test_legacy_token_obtain_policy.py apps/accounts/tests/test_refresh_user_id_compatibility.py apps/accounts/tests/test_jwt_user_acceptance.py apps/accounts/tests/test_refresh_failure_contract.py apps/accounts/tests/jwt_transition_worker.py
          ruff format --check apps/ai_gateway scripts/check_ai_gateway_headers.py scripts/ai_gateway_dependency_profile.py scripts/check_jwt_user_transitions.py apps/accounts/serializers/session_refresh.py apps/accounts/views/token_obtain_views.py apps/accounts/tests/test_legacy_token_obtain_policy.py apps/accounts/tests/test_refresh_user_id_compatibility.py apps/accounts/tests/test_jwt_user_acceptance.py apps/accounts/tests/test_refresh_failure_contract.py apps/accounts/tests/jwt_transition_worker.py

      - name: Start disposable MySQL with no network or published ports
        run: |
          mkdir -p ../b1-mysql-socket
          docker run --detach --rm --name townlit-b1-mysql --network none \
            --mount "type=bind,src=$(realpath ../b1-mysql-socket),dst=/var/run/mysqld" \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=townlit_b1_disposable \
            mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902 \
            --skip-log-bin --innodb-flush-log-at-trx-commit=2
          for attempt in $(seq 1 60); do
            # The entrypoint starts a temporary server before the real PID 1.
            if docker exec townlit-b1-mysql sh -c 'test "$(cat /proc/1/comm)" = mysqld' \
              && docker exec townlit-b1-mysql mysql -uroot --database=townlit_b1_disposable -Nse 'SELECT 1;'; then
              docker exec townlit-b1-mysql chmod 755 /var/run/mysqld
              docker exec townlit-b1-mysql mysql -uroot -Nse 'SELECT VERSION();'
              exit 0
            fi
            sleep 2
          done
          docker logs townlit-b1-mysql
          exit 1

      - name: Run Gateway security tests on MySQL and SQLite
        run: |
          python -m apps.ai_gateway.tests.run mysql test apps.ai_gateway.tests --noinput -v 2
          python -m apps.ai_gateway.tests.run core test apps.ai_gateway.tests --noinput -v 2

      - name: Check Gateway migration drift and reversibility
        run: |
          python -m apps.ai_gateway.tests.run mysql makemigrations ai_gateway --check --dry-run
          python -m apps.ai_gateway.tests.run backend makemigrations ai_gateway accounts --check --dry-run
          python -m apps.ai_gateway.tests.run mysql migrate ai_gateway --noinput
          python -m apps.ai_gateway.tests.run mysql migrate ai_gateway zero --noinput
          python -m apps.ai_gateway.tests.run mysql migrate ai_gateway --noinput
          python -m apps.ai_gateway.tests.run backend check

      - name: Run selected Backend regressions with the full migration graph
        run: |
          python -m apps.ai_gateway.tests.run backend test \
            apps.ai_gateway.tests.backend_regression \
            apps.accounts.tests.test_session_jwt_issuance \
            apps.accounts.tests.test_session_generation_enforcement \
            apps.accounts.tests.test_session_security_foundation \
            apps.accounts.tests.test_legacy_token_obtain_policy \
            apps.accounts.tests.test_password_reset_token_v2 \
            apps.accounts.tests.test_password_session_revocation \
            apps.accounts.tests.test_two_factor_login_single_use \
            apps.accounts.tests.test_backend_exception_redaction \
            --noinput --keepdb -v 2

      - name: Verify signed refresh claims and current account policy
        run: |
          python -m apps.ai_gateway.tests.run backend test apps.accounts.tests.test_refresh_user_id_compatibility --noinput --keepdb -v 2

      - name: Run expanded account and WebSocket acceptance
        run: |
          python -m apps.ai_gateway.tests.run backend test \
            apps.accounts.tests.test_jwt_user_acceptance \
            apps.accounts.tests.test_refresh_failure_contract \
            apps.accounts.tests.test_password_reset_disclosure \
            apps.accounts.tests.test_account_deletion_organization_guard \
            apps.accounts.tests.test_litshield_organization_contract \
            apps.accounts.tests.test_social_organization_contract \
            apps.accounts.tests.test_townlit_organization_score \
            tests.test_ws_access_auth tests.test_ws_v2_gateway \
            tests.test_security_logging tests.test_presence_utc_compat \
            --noinput --keepdb -v 2

      - name: Verify preserved checkpoint data protection
        run: |
          python -m apps.ai_gateway.tests.run backend test \
            apps.core.crypto.tests.test_field_protection \
            apps.accounts.tests.test_email_encrypted_only_cutover \
            apps.accounts.tests.test_email_natural_key_compat \
            --noinput --keepdb -v 2

      - name: Execute real cross-version issuance, refresh and rollback
        if: matrix.profile == 'supported'
        run: |
          python scripts/ai_gateway_dependency_profile.py baseline > ../jwt-baseline-profile.txt
          python -m venv ../jwt-baseline-venv
          ../jwt-baseline-venv/bin/python -m pip install -r ../jwt-baseline-profile.txt
          ../jwt-baseline-venv/bin/python -m pip check
          python scripts/check_jwt_user_transitions.py \
            --baseline-python ../jwt-baseline-venv/bin/python \
            --supported-python "$(command -v python)" \
            --output ../jwt-synthetic-transition-artifacts

      - name: Remove only this job's disposable database container
        if: always()
        run: docker rm --force townlit-b1-mysql || true
